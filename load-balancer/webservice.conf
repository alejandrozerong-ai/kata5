upstream fibonacci_upstream {
    zone fibonacci_upstream 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=fibonacci_service_v1 resolve;
}

upstream primes_upstream {
    zone primes_upstream 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=primes_service_v1 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/fibonacci/ {
        proxy_pass http://fibonacci_upstream/;
    }

    location /api/v1/primes/ {
        proxy_pass http://primes_upstream/;
    }

    location / {
        return 404;
    }
}